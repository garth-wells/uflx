[project]
name = "uflx-cuda"
version = "0.0.1"
description = "Experimental CUDA code generation for UFLx forms"
readme = "README.md"
requires-python = ">=3.11.0"
license = "MIT"
authors = [{ name = "Codex", email = "codex@openai.com" }]
dependencies = ["uflx"]

[project.urls]
homepage = "https://github.com/garth-wells/uflx"
repository = "https://github.com/garth-wells/uflx"

[project.optional-dependencies]
ci = ["basix-uflx", "fenics-basix", "pytest"]
lint = ["ruff"]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["D", "E", "F", "FLY", "I", "ICN", "ISC", "LOG", "NPY", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["test"]
